      property="og:description"
      content="জার্মান A1 ভোকাবুলারি শেখার জন্য মোবাইল-ফার্স্ট ও অফলাইন PWA অ্যাপ — শোনা, মাইক্রোফোনে উচ্চারণ অনুশীলন, লেখা ও কুইজসহ ৪৭টি লেভেল।"

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gth');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#F8F9FB] text-[#0F172A] dark:bg-[#0B101B] dark:text-[#F1F5F9] antialiased selection:bg-blue-600 selection:text-white">
