function ins(c){const e=$("ans");e.value+=c;e.focus()}
function chk(){const s=$("stage");if(s.dataset.l){go();return}s.dataset.l=1;const w=cur();
const v=tn($("ans").value),ok=w.T.some(t=>t===v);if(ok)add(15);
$("res").innerHTML=(ok?'<div class="g">✅ সঠিক!</div>':`<div class="r">❌ সঠিক উত্তর: ${w.de}</div>`)+nextBtn;speak(w.sp)}
function rec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=$("res");
if(!SR){r.innerHTML="এই ব্রাউজারে মাইক সাপোর্ট নেই। নিজে বলে নিচের বাটন চাপুন।";return}
const q=new SR();q.lang="de-DE";r.textContent="শুনছি…";
q.onresult=e=>{const t=e.results[0][0].transcript,ok=cur().T.some(x=>sim(tn(t),x)>=.8);
if(ok)add(10);r.innerHTML=ok?`<span class="g">✅ দারুণ! আপনি বলেছেন: ${t}</span>`:`<span class="r">আপনি বলেছেন: ${t} — আবার চেষ্টা করুন</span>`};
q.onerror=()=>{r.textContent="মাইক ব্যবহার করা যায়নি। নিজে বলে নিচের বাটন চাপুন।"};q.start()}
function init(){const ks=Object.keys(L),tot=ks.reduce((s,k)=>s+L[k].w.length,0);
$("lv").innerHTML=ks.map(k=>`<option value="${k}">লেভেল ${k}</option>`).join("");$("lv").value=lvl;
$("cw").textContent=`📚 ${tot} শব্দ · ${ks.length} লেভেল`;$("bt").textContent=`✅ ${tot}টি শব্দভাণ্ডার (${ks.length} লেভেল) লোড আছে!`;add(0);i=0;render(false)}
$("lv").onchange=e=>{lvl=+e.target.value;i=0;render(false)};
$("rs").onclick=()=>{i=0;render(false)};
$("th").onclick=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=c==="dark"?"light":"dark"};
$("fb").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const n={};JSON.parse(t).forEach(x=>{const k=x.level||1;(n[k]=n[k]||{t:"Level "+k,w:[]}).w.push(W(x.de,x.en||"",x.bn||"","Level "+k,""+k))});
if(Object.keys(n).length){L=n;lvl=+Object.keys(n)[0];init()}}catch(err){alert('ফাইলটি সঠিক JSON নয়। ফরম্যাট: [{"de":"Hallo","en":"hello","bn":"হ্যালো","level":1}]')}})};
function pop(n){const t=document.createElement("div");t.className="toast";t.textContent="+"+n+" XP";document.body.appendChild(t);setTimeout(()=>t.remove(),1200)}
$("th").onclick=()=>{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("gth",n)}catch(e){}};
try{const s=localStorage.getItem("gth");if(s)document.documentElement.dataset.theme=s}catch(e){}
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target.tagName;if(t==="INPUT"||t==="SELECT")return;
if(mode==="quiz"&&/^[1-4]$/.test(e.key)){const o=document.querySelectorAll(".opt")[+e.key-1];if(o)o.click();return}
if(e.key==="Enter"||e.key==="ArrowRight"){const n=document.querySelector("#stage .nx");if(n){e.preventDefault();n.click()}return}
if(e.key===" "&&mode!=="write"){e.preventDefault();speak(cur().sp)}});
init();
</script></body></html>
